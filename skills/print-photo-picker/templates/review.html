<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>打印照片筛选 · 审阅</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 16px; background: #111; color: #eee; }
    h1, h2 { margin: 0.4em 0; }
    .toolbar { margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    button { padding: 8px 12px; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .card { background: #222; border-radius: 8px; padding: 8px; border: 1px solid #333; }
    .card img { width: 100%; height: 140px; object-fit: cover; border-radius: 4px; background: #000; }
    .meta { font-size: 12px; color: #aaa; word-break: break-all; }
    .tag { display: inline-block; background: #444; padding: 2px 6px; border-radius: 4px; margin: 2px 2px 0 0; font-size: 11px; }
    .session { margin: 24px 0; padding-top: 8px; border-top: 1px solid #333; }
  </style>
</head>
<body>
  <h1>打印照片筛选审阅</h1>
  <div class="toolbar">
    <button id="exportManifest">导出 delete_manifest.json</button>
    <span id="summary"></span>
  </div>
  <div id="root"></div>
  <script>
    const REPORT = /*__REPORT_JSON__*/;
    const images = REPORT.images || [];
    const bySession = {};
    images.forEach(img => {
      const sid = img.session_id || img.quality_label || 'other';
      (bySession[sid] ||= []).push(img);
    });
    const root = document.getElementById('root');
    Object.keys(bySession).sort().forEach(sid => {
      const sec = document.createElement('div');
      sec.className = 'session';
      sec.innerHTML = `<h2>${sid}</h2><div class="grid"></div>`;
      const grid = sec.querySelector('.grid');
      bySession[sid].forEach(img => {
        const card = document.createElement('div');
        card.className = 'card';
        const fileUrl = 'file://' + img.path;
        card.innerHTML = `
          <label><input type="checkbox" class="pick" data-path="${img.path}" /> 待删确认</label>
          <img src="${fileUrl}" alt="" loading="lazy" onerror="this.style.opacity=0.3" />
          <div class="meta">${img.path.split('/').pop()}</div>
          <div class="meta">label=${img.quality_label} · disp=${img.disposition} · score=${img.session_score}</div>
          <div>${(img.tags||[]).map(t => `<span class="tag">${t}</span>`).join('')}</div>`;
        grid.appendChild(card);
      });
      root.appendChild(sec);
    });
    document.getElementById('summary').textContent =
      `共 ${images.length} 张 · 合格 ${REPORT.stats?.qualified ?? 0}`;
    document.getElementById('exportManifest').onclick = () => {
      const paths = [...document.querySelectorAll('.pick:checked')].map(el => el.dataset.path);
      const manifest = { generated_at: new Date().toISOString(), paths, note: '交给 Agent 二次确认后 host_safe_delete' };
      const blob = new Blob([JSON.stringify(manifest, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'delete_manifest.json';
      a.click();
    };
  </script>
</body>
</html>

name: Deploy UI design preview

on:
  push:
    branches: [master, main]
    paths:
      - 'diy-stall-miniprogram/design-preview/**'
      - '.github/workflows/design-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: design-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: diy-stall-miniprogram/design-preview
      - id: deployment
        uses: actions/deploy-pages@v4
